<template>
    <lightning-card title="Work Breakdown Structure" icon-name="utility:hierarchy">
        <div slot="actions">
            <lightning-button
                label="Add Root Item"
                icon-name="utility:add"
                onclick={handleAddRoot}
                variant="neutral"
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                label="Run CPM"
                icon-name="utility:apex"
                onclick={handleRunCPM}
                variant="neutral"
                disabled={isCpmRunning}>
            </lightning-button>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading WBS" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-vertical_small" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <template lwc:if={hasData}>
                <div class="wbs-table">
                    <!-- header -->
                    <div class="wbs-header">
                        <div class="wbs-th wbs-col-name" style="text-align:left">WBS Code &amp; Name</div>
                        <div class="wbs-th wbs-col-dep">Predecessor/Successor</div>
                        <div class="wbs-th wbs-col-pred">Predecessor</div>
                        <div class="wbs-th wbs-col-dur num">Duration</div>
                        <div class="wbs-th wbs-col-budget num">Budget</div>
                        <div class="wbs-th wbs-col-progress th-progress">Progress</div>
                        <div class="wbs-th wbs-col-start">Start Date</div>
                        <div class="wbs-th wbs-col-end">End Date</div>
                        <div class="wbs-th wbs-col-float num">Float (d)</div>
                        <div class="wbs-th wbs-col-actions"></div>
                    </div>

                    <!-- rows -->
                    <template for:each={flatRows} for:item="row">
                        <div key={row.id} class={row.rowClass}>

                            <!-- name cell -->
                            <div class="wbs-td wbs-col-name">
                                <span class="drag-dots" title="Row handle">&#x22EE;&#x22EE;</span>
                                <div class="name-inner" style={row.indentStyle}>
                                    <template lwc:if={row.hasChildren}>
                                        <button class="toggle-btn" onclick={handleToggle} data-id={row.id} title="Expand / Collapse">
                                            <lightning-icon icon-name={row.toggleIcon} size="xx-small" alternative-text="Toggle"></lightning-icon>
                                        </button>
                                    </template>
                                    <template lwc:else>
                                        <span class="toggle-placeholder"></span>
                                    </template>
                                    <span class={row.codeClass}>{row.wbsCode}</span>
                                    <span class={row.nameClass}
                                          onclick={handleRowClick}
                                          data-id={row.id}
                                          data-label={row.name}
                                          data-pct={row.progressRaw}
                                          title="Click to log progress">{row.name}</span>
                                    <template lwc:if={row.isCritical}>
                                        <lightning-icon icon-name="utility:warning" size="xx-small" variant="error" class="slds-m-left_xx-small"></lightning-icon>
                                    </template>
                                </div>
                            </div>

                            <!-- dependency type -->
                            <div class="wbs-td wbs-col-dep">{row.depTypeFull}</div>

                            <!-- predecessor code -->
                            <div class="wbs-td wbs-col-pred">{row.predecessorCode}</div>

                            <!-- duration -->
                            <div class="wbs-td wbs-col-dur num">{row.durationDays}</div>

                            <!-- budget -->
                            <div class="wbs-td wbs-col-budget num">{row.budgetFormatted}</div>

                            <!-- progress bar + label (also clickable) -->
                            <div class="wbs-td wbs-col-progress progress-cell-clickable"
                                 onclick={handleRowClick}
                                 data-id={row.id}
                                 data-label={row.name}
                                 data-pct={row.progressRaw}
                                 title="Click to log progress">
                                <div class="progress-track">
                                    <div class="progress-fill" style={row.progressFillStyle}></div>
                                </div>
                                <span class="progress-pct">{row.progressLabel}</span>
                            </div>

                            <!-- start date -->
                            <div class="wbs-td wbs-col-start">{row.startFormatted}</div>

                            <!-- end date -->
                            <div class="wbs-td wbs-col-end">{row.endFormatted}</div>

                            <!-- float -->
                            <div class="wbs-td wbs-col-float num">{row.floatDisplay}</div>

                            <!-- row actions -->
                            <div class="wbs-td wbs-col-actions">
                                <lightning-button-icon
                                    icon-name="utility:add"
                                    title="Add Child"
                                    alternative-text="Add Child"
                                    size="xx-small"
                                    variant="border-filled"
                                    class="action-btn"
                                    onclick={handleAddChild}
                                    data-id={row.id}
                                    data-label={row.name}>
                                </lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:people"
                                    title="Manage Resources"
                                    alternative-text="Manage Resources"
                                    size="xx-small"
                                    variant="border-filled"
                                    class="action-btn"
                                    onclick={handleManageResources}
                                    data-id={row.id}
                                    data-label={row.name}>
                                </lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:edit"
                                    title="Edit"
                                    alternative-text="Edit"
                                    size="xx-small"
                                    variant="border-filled"
                                    class="action-btn"
                                    onclick={handleEdit}
                                    data-id={row.id}
                                    data-label={row.name}>
                                </lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    title="Delete"
                                    alternative-text="Delete"
                                    size="xx-small"
                                    variant="border-filled"
                                    class="action-btn"
                                    onclick={handleDelete}
                                    data-id={row.id}
                                    data-label={row.name}>
                                </lightning-button-icon>
                            </div>

                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={isEmpty}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:hierarchy" size="large"></lightning-icon>
                        <p class="slds-text-heading_small slds-m-top_medium">No WBS items yet</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                            Add a root item to build your work breakdown structure
                        </p>
                        <div class="slds-m-top_medium">
                            <lightning-button label="Add First Item" variant="brand" onclick={handleAddRoot}></lightning-button>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </lightning-card>

    <!-- Add / Edit Modal -->
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeModal}>
                    </lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <lightning-record-edit-form
                    object-api-name="WBS_Item__c"
                    record-id={editRecordId}
                    onsubmit={handleSubmit}
                    onsuccess={handleSaveSuccess}
                    onerror={handleSaveError}>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-messages></lightning-messages>
                        <div class="slds-grid slds-wrap slds-gutters_small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Name"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="WBS_Code__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Level__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Duration_Days__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Start_Date__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="End_Date__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Budget__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Progress__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Predecessor__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Dependency_Type__c"></lightning-input-field>
                            </div>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button
                            type="submit"
                            label="Save"
                            variant="brand"
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Log Progress Modal -->
    <template lwc:if={showProgressModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeProgressModal}>
                    </lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">Log Progress</h2>
                    <p class="slds-m-top_xx-small" style="color:rgba(255,255,255,.75);font-size:.8125rem;">{progressItemName}</p>
                </header>

                <div class="slds-modal__content slds-p-around_large">

                    <!-- Big slider area -->
                    <div class="prog-slider-wrap">
                        <div class="prog-display">{sliderDisplay}%</div>
                        <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            class="prog-slider"
                            value={sliderValue}
                            oninput={handleSliderInput}>
                        <div class="prog-slider-labels">
                            <span>0%</span>
                            <span>25%</span>
                            <span>50%</span>
                            <span>75%</span>
                            <span>100%</span>
                        </div>
                    </div>

                    <!-- Exact number input -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="prog-exact">Exact %</label>
                        <div class="slds-form-element__control">
                            <input
                                type="number"
                                id="prog-exact"
                                min="0"
                                max="100"
                                class="slds-input prog-exact-input"
                                value={sliderValue}
                                oninput={handleExactInput}>
                        </div>
                    </div>

                    <!-- Remarks -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="prog-notes">Remarks (optional)</label>
                        <div class="slds-form-element__control">
                            <textarea
                                id="prog-notes"
                                class="slds-textarea"
                                rows="2"
                                placeholder="Any notes for this update…"
                                oninput={handleNotesInput}></textarea>
                        </div>
                    </div>

                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeProgressModal}></lightning-button>
                    <lightning-button
                        label="Save Progress"
                        variant="brand"
                        class="slds-m-left_x-small"
                        onclick={handleProgressSave}
                        disabled={isSavingProgress}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Manage Resources Modal -->
    <template lwc:if={showResourceModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeResourceModal}>
                    </lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">Manage Resources</h2>
                    <p class="slds-m-top_xx-small" style="color:rgba(255,255,255,.75);font-size:.8125rem;">{resourceWbsItemName}</p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <template lwc:if={isLoadingAllocations}>
                        <div class="slds-align_absolute-center slds-p-around_medium">
                            <lightning-spinner alternative-text="Loading allocations" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template lwc:if={hasAllocations}>
                        <ul class="slds-has-dividers_bottom-space">
                            <template for:each={resourceAllocations} for:item="alloc">
                                <li key={alloc.id} class="slds-item slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-vertical_xx-small">
                                    <div class="slds-truncate">
                                        <span class="slds-text-body_regular slds-text-title_bold">{alloc.resourceName}</span>
                                        <template lwc:if={alloc.role}>
                                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">{alloc.role}</span>
                                        </template>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            <span>{alloc.pctLabel}</span>
                                            <template lwc:if={alloc.rangeLabel}>
                                                <span class="slds-m-left_small">{alloc.rangeLabel}</span>
                                            </template>
                                        </div>
                                    </div>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        title="Remove"
                                        alternative-text="Remove"
                                        size="x-small"
                                        variant="border-filled"
                                        onclick={handleAllocDelete}
                                        data-id={alloc.id}
                                        data-label={alloc.resourceName}>
                                    </lightning-button-icon>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <template lwc:if={isAllocationsEmpty}>
                        <p class="slds-text-body_regular slds-text-color_weak slds-p-vertical_x-small">
                            No resources allocated to this item yet.
                        </p>
                    </template>

                    <!-- Add allocation -->
                    <template lwc:if={showAllocForm}>
                        <div class="slds-box slds-box_x-small slds-m-top_small">
                            <lightning-record-edit-form
                                object-api-name="Resource_Allocation__c"
                                onsubmit={handleAllocSubmit}
                                onsuccess={handleAllocSaveSuccess}
                                onerror={handleAllocSaveError}>
                                <lightning-messages></lightning-messages>
                                <div class="slds-grid slds-wrap slds-gutters_small">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Resource__c" required></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Role__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Allocation_Percent__c" required></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2"></div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Start_Date__c" required></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="End_Date__c" required></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-m-top_small slds-text-align_right">
                                    <lightning-button type="submit" label="Add" variant="brand"></lightning-button>
                                </div>
                            </lightning-record-edit-form>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-m-top_small">
                            <lightning-button
                                label="Allocate Resource"
                                icon-name="utility:add"
                                variant="neutral"
                                onclick={handleShowAllocForm}>
                            </lightning-button>
                        </div>
                    </template>

                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeResourceModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

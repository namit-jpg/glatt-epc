<template>
    <lightning-card title={cardTitle} icon-name="standard:product_item">
        <div slot="actions">
            <lightning-button
                label="New"
                icon-name="utility:add"
                onclick={handleNew}
                variant="brand">
            </lightning-button>
        </div>

        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading line items" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-vertical_small" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <template lwc:if={hasData}>
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>

                <div class="slds-grid slds-grid_align-end slds-p-around_small slds-text-heading_small">
                    <span class="slds-text-color_weak slds-p-right_x-small">Total Value:</span>
                    <strong>
                        <lightning-formatted-number value={totalValue} format-style="currency"
                            currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number>
                    </strong>
                </div>
            </template>

            <template lwc:if={isEmpty}>
                <div class="slds-illustration slds-illustration_small slds-align_absolute-center slds-p-around_large">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="standard:product_item" size="large"></lightning-icon>
                        <p class="slds-text-heading_small slds-m-top_medium">No line items yet</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                            Add products and materials being quoted on this RFQ.
                        </p>
                        <div class="slds-m-top_medium">
                            <lightning-button label="Add First Line Item" variant="brand" onclick={handleNew}></lightning-button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Add / Edit Modal -->
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeModal}>
                    </lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <lightning-record-edit-form
                    object-api-name="RFQ_Line_Item__c"
                    record-id={editRecordId}
                    onsubmit={handleSubmit}
                    onsuccess={handleSaveSuccess}
                    onerror={handleSaveError}>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-messages></lightning-messages>
                        <div class="slds-grid slds-wrap slds-gutters_small">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input-field field-name="Material_Name__c" required></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input-field field-name="Product__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input-field field-name="Quantity__c" required></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input-field field-name="Unit__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input-field field-name="Unit_Price__c" required></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input-field field-name="Notes__c"></lightning-input-field>
                            </div>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button
                            type="submit"
                            label="Save"
                            variant="brand"
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

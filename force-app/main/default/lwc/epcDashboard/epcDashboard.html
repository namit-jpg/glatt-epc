<template>
    <div class="dash-root">

        <!-- ── Header ──────────────────────────────────────────── -->
        <div class="dash-header">
            <div class="dash-header-inner">
                <div class="dash-header-left">
                    <div class="dash-header-icon">
                        <lightning-icon icon-name="standard:dashboard" size="small"></lightning-icon>
                    </div>
                    <div>
                        <h1 class="dash-title">EPC Management Dashboard</h1>
                        <p class="dash-subtitle">Live project portfolio · Critical path · Field reports</p>
                    </div>
                </div>
                <lightning-button-icon icon-name="utility:refresh" variant="bare-inverse"
                    alternative-text="Refresh" title="Refresh" onclick={handleRefresh}
                    disabled={isRefreshing}>
                </lightning-button-icon>
            </div>
        </div>

        <!-- ── Loading / Error ─────────────────────────────────── -->
        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:if={hasError}>
            <div class="dash-error slds-m-around_medium" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                {errorMessage}
            </div>
        </template>

        <!-- ── Body ────────────────────────────────────────────── -->
        <template lwc:if={hasData}>
        <div class="dash-body">

            <!-- KPI row -->
            <div class="kpi-grid">

                <div class="kpi-card kpi-card_indigo">
                    <div class="kpi-icon">
                        <lightning-icon icon-name="utility:office" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="kpi-meta">
                        <span class="kpi-label">Active Projects</span>
                        <div class="kpi-num">{projectCount}</div>
                        <span class="kpi-foot">Live portfolio</span>
                    </div>
                </div>

                <div class="kpi-card kpi-card_blue">
                    <div class="kpi-icon">
                        <lightning-icon icon-name="utility:currency" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="kpi-meta">
                        <span class="kpi-label">Portfolio Budget</span>
                        <div class="kpi-num">{totalBudgetLabel}</div>
                        <span class="kpi-foot">{totalSpentLabel} committed</span>
                    </div>
                </div>

                <div class="kpi-card kpi-card_green">
                    <div class="kpi-icon">
                        <lightning-icon icon-name="utility:trending" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="kpi-meta">
                        <span class="kpi-label">Average Progress</span>
                        <div class="kpi-num">{avgProgressLabel}</div>
                        <div class="kpi-bar-track">
                            <div class="kpi-bar-fill" style={avgProgressBarStyle}></div>
                        </div>
                    </div>
                </div>

                <div class="kpi-card kpi-card_red">
                    <div class="kpi-icon">
                        <lightning-icon icon-name="utility:warning" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="kpi-meta">
                        <span class="kpi-label">Critical Path Items</span>
                        <div class="kpi-num">{criticalItemCount}</div>
                        <span class="kpi-foot">{atRiskCount} near-critical</span>
                    </div>
                </div>

            </div><!-- /kpi-grid -->

            <!-- Main two-column area -->
            <div class="main-grid">

                <!-- Left: portfolio table -->
                <div class="panel">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:list" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <span>Project Portfolio</span>
                    </div>
                    <div class="panel-body">
                        <table class="ptable">
                            <thead>
                                <tr>
                                    <th style="width:32%">Project</th>
                                    <th style="width:11%">BU</th>
                                    <th style="width:12%">Status</th>
                                    <th style="width:24%">Progress</th>
                                    <th style="width:11%">Budget</th>
                                    <th style="width:10%">End</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={portfolio} for:item="proj">
                                    <tr key={proj.id} class={proj.rowAccentClass}>
                                        <td>
                                            <div class="ptable-name" title={proj.name}>{proj.name}</div>
                                            <div class="ptable-sub">{proj.nature} · {proj.location}</div>
                                        </td>
                                        <td><span class={proj.buClass}>{proj.businessUnit}</span></td>
                                        <td><span class={proj.statusClass}>{proj.status}</span></td>
                                        <td>
                                            <div class="prog-wrap">
                                                <div class="prog-track">
                                                    <div class={proj.progressFillClass} style={proj.progressStyle}></div>
                                                </div>
                                                <span class="prog-pct">{proj.progressLabel}</span>
                                            </div>
                                        </td>
                                        <td class="ptable-num">{proj.budgetLabel}</td>
                                        <td class="ptable-num">{proj.endDateLabel}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Right column -->
                <div class="right-col">

                    <!-- Status distribution -->
                    <div class="panel panel_compact">
                        <div class="panel-header">
                            <lightning-icon icon-name="utility:pie_chart" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>Project Status</span>
                        </div>
                        <div class="panel-body">
                            <div class="donut-row">
                                <div class="donut-container">
                                    <svg viewBox="0 0 42 42" class="donut-svg">
                                        <circle cx="21" cy="21" r="15.9155" fill="transparent"
                                                stroke="#e8e8e8" stroke-width="5"/>
                                        <template for:each={donutSegments} for:item="seg">
                                            <circle key={seg.id}
                                                    cx="21" cy="21" r="15.9155"
                                                    fill="transparent"
                                                    stroke={seg.color}
                                                    stroke-width="5"
                                                    stroke-dasharray={seg.dasharray}
                                                    stroke-dashoffset={seg.dashoffset}>
                                            </circle>
                                        </template>
                                    </svg>
                                    <div class="donut-center">
                                        <span class="donut-center-num">{projectCount}</span>
                                        <span class="donut-center-lbl">Total</span>
                                    </div>
                                </div>
                                <div class="donut-legend">
                                    <template for:each={donutSegments} for:item="seg">
                                        <div key={seg.id} class="legend-row">
                                            <span class="legend-dot" style={seg.dotStyle}></span>
                                            <span class="legend-label">{seg.label}</span>
                                            <span class="legend-count">{seg.count}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BU breakdown -->
                    <div class="panel panel_compact">
                        <div class="panel-header">
                            <lightning-icon icon-name="utility:company" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>By Business Unit</span>
                        </div>
                        <div class="panel-body">
                            <template for:each={buBreakdown} for:item="bu">
                                <div key={bu.businessUnit} class="bu-row">
                                    <div class="bu-row-head">
                                        <span class={bu.buClass}>{bu.businessUnit}</span>
                                        <span class="bu-row-meta">{bu.projectCount} project{bu.pluralSuffix} · {bu.budgetLabel}</span>
                                    </div>
                                    <div class="prog-track prog-track_sm">
                                        <div class="prog-fill-green" style={bu.progressStyle}></div>
                                    </div>
                                    <div class="bu-row-foot">{bu.progressLabel} avg progress</div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Budget vs spend -->
                    <div class="panel panel_compact">
                        <div class="panel-header">
                            <lightning-icon icon-name="utility:currency" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>Budget vs Spend</span>
                        </div>
                        <div class="panel-body">
                            <template for:each={portfolio} for:item="proj">
                                <div key={proj.id} class="spend-row">
                                    <div class="spend-row-head">
                                        <span class="spend-name">{proj.name}</span>
                                        <span class="spend-nums">{proj.spentLabel} / {proj.budgetLabel}</span>
                                    </div>
                                    <div class="prog-track prog-track_sm">
                                        <div class="prog-fill-orange" style={proj.spentStyle}></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div><!-- /right-col -->

            </div><!-- /main-grid -->

            <!-- Bottom row: critical path + field reports -->
            <div class="bottom-grid">

                <div class="panel">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:routing_offline" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <span>Critical Path Items</span>
                    </div>
                    <div class="panel-body">
                        <template lwc:if={hasCriticalItems}>
                            <table class="ptable">
                                <thead>
                                    <tr>
                                        <th style="width:13%">Code</th>
                                        <th style="width:37%">Activity</th>
                                        <th style="width:25%">Project</th>
                                        <th style="width:13%">Float</th>
                                        <th style="width:12%">Finish</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={criticalItems} for:item="item">
                                        <tr key={item.id}>
                                            <td><code>{item.wbsCode}</code></td>
                                            <td><div class="ptable-name" title={item.name}>{item.name}</div></td>
                                            <td class="ptable-sub">{item.projectName}</td>
                                            <td><span class={item.riskClass}>{item.riskLabel}</span></td>
                                            <td class="ptable-num">{item.endDateLabel}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <p class="panel-empty">No critical path items — run CPM on a project to generate.</p>
                        </template>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:today" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <span>Recent Field Reports</span>
                    </div>
                    <div class="panel-body">
                        <template lwc:if={hasLogs}>
                            <ul class="log-list">
                                <template for:each={recentLogs} for:item="log">
                                    <li key={log.id} class="log-item">
                                        <div class="log-row-head">
                                            <div class="log-left">
                                                <span class="log-wp">{log.wpName}</span>
                                                <span class="log-proj">· {log.projectName}</span>
                                            </div>
                                            <div class="log-right">
                                                <span class="log-pct">{log.percentLabel}%</span>
                                                <span class="log-weather">{log.weatherIcon}</span>
                                            </div>
                                        </div>
                                        <div class="log-notes">{log.notesSnippet}</div>
                                        <div class="log-meta">{log.dateLabel} · {log.loggedBy}</div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p class="panel-empty">No field reports logged yet.</p>
                        </template>
                    </div>
                </div>

            </div><!-- /bottom-grid -->

        </div><!-- /dash-body -->
        </template>

        <!-- Empty state -->
        <template lwc:if={isEmpty}>
            <div class="slds-illustration slds-illustration_small slds-p-around_large">
                <div class="slds-text-align_center">
                    <h3 class="slds-text-heading_medium">No project data yet</h3>
                    <p class="slds-text-body_regular">Create a project and run CPM to populate this dashboard.</p>
                </div>
            </div>
        </template>

    </div>
</template>
